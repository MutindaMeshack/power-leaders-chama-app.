<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Register - Power Leaders App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
    h2 { margin-top: 0; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .flash { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .flash.success { background: #d4edda; color: #155724; }
    .flash.danger { background: #f8d7da; color: #721c24; }
    .link { text-align: center; margin-top: 12px; font-size: 14px; }
    a { color: #2c3e50; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="text" name="phone" placeholder="Phone number (e.g. 07xxxxxxxx)" required>
      <input type="password" name="password" placeholder="Choose a password" required>
      <input type="password" name="confirm_password" placeholder="Confirm password" required>
      <button type="submit">Register</button>
    </form>

    <div class="link">Already have an account? <a href="{{ url_for('member_login') }}">Log in</a></div>
  </div>
</body>
</html>
